<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Pluto — A little curiosity, a little progress.</title>
  <desc id="desc">An ivory and sage green banner with a small planet, delicate orbit lines and distant hills.</desc>
  <defs>
    <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#f8f9f3"/><stop offset="1" stop-color="#eaf2ee"/></linearGradient>
    <linearGradient id="planet" x2="1" y2="1"><stop stop-color="#e4bfa8"/><stop offset="1" stop-color="#c2927c"/></linearGradient>
    <clipPath id="round"><rect width="1280" height="360" rx="20"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1280" height="360" fill="url(#paper)"/>
    <path d="M0 321 Q180 260 370 317 T770 311 T1280 279 V360 H0Z" fill="#dce8df" opacity=".65"/>
    <path d="M0 348 Q220 302 450 345 T930 328 T1280 339 V360 H0Z" fill="#c8dbcf" opacity=".55"/>
    <g fill="none" stroke="#a5bbb0" stroke-width="1.2" opacity=".7">
      <ellipse cx="1010" cy="164" rx="190" ry="74" transform="rotate(-26 1010 164)"/>
      <ellipse cx="1010" cy="164" rx="142" ry="108" transform="rotate(22 1010 164)" stroke-dasharray="3 9" opacity=".65"/>
    </g>
    <circle cx="1010" cy="164" r="49" fill="url(#planet)"/>
    <path d="M979 146 Q1004 127 1035 149 M980 179 Q1012 156 1044 175" fill="none" stroke="#f7e4d5" stroke-width="9" stroke-linecap="round" opacity=".36"/>
    <circle cx="1169" cy="94" r="7" fill="#87a497"/>
    <g fill="#a9bcb0"><circle cx="838" cy="84" r="2"/><circle cx="1126" cy="257" r="2"/><circle cx="777" cy="232" r="2"/></g>
    <path d="M1160 217 v12 m-6-6 h12 M902 47 v10 m-5-5 h10" stroke="#9bb3a5" stroke-width="1.4"/>
    <text x="76" y="85" font-family="Arial,sans-serif" font-size="12" letter-spacing="4" fill="#6d877b">A SMALL CORNER OF THE INTERNET</text>
    <text x="72" y="177" font-family="Georgia,serif" font-size="78" fill="#304b40">Hello, I'm Pluto.</text>
    <text x="77" y="223" font-family="Georgia,serif" font-style="italic" font-size="23" fill="#6c8175">A little curiosity, a little progress.</text>
    <text x="77" y="275" font-family="Arial,sans-serif" font-size="13" letter-spacing="2" fill="#71877a">C++  /  PYTHON  /  NOTES &amp; IDEAS</text>
